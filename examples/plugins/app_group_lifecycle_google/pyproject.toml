# Packaging metadata for the App Group Lifecycle Google Group Management Plugin.
#
# The [project.entry-points] table below is what registers the plugin with
# Access: pluggy discovers implementations through the
# "access_app_group_lifecycle" entry point group.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "app_group_lifecycle_google"
version = "0.1.0"
description = "Plugin for managing Google groups linked to Access groups"
authors = [{ name = "Discord" }]
dependencies = [
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
]

[project.entry-points."access_app_group_lifecycle"]
google_group_manager = "app_group_lifecycle_google.plugin:google_group_manager_plugin"

# The package lives at the root of this directory rather than in a nested
# subdirectory, so map the import name onto ".".
[tool.setuptools]
packages = ["app_group_lifecycle_google"]

[tool.setuptools.package-dir]
app_group_lifecycle_google = "."
