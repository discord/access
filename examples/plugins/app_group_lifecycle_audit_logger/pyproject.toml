# Packaging metadata for the App Group Lifecycle Audit Logger example plugin.
#
# The [project.entry-points] table below is what registers the plugin with
# Access: pluggy discovers implementations through the
# "access_app_group_lifecycle" entry point group.
#
# This example uses pyproject.toml rather than the setup.py the other example
# plugins carry because the root pyproject.toml names it as a `[tool.uv.sources]`
# path dependency, and Dependabot's uv file fetcher requires a pyproject.toml in
# every path-source directory. Either form works for `uv pip install`.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "app_group_lifecycle_audit_logger"
version = "0.1.0"
description = "Example app group lifecycle plugin that logs all group events"
authors = [{ name = "Discord" }]
dependencies = [
    "SQLAlchemy",
]

# Register the plugin with the app group lifecycle plugin system
[project.entry-points.access_app_group_lifecycle]
audit_logger = "app_group_lifecycle_audit_logger.plugin:audit_logger_plugin"

# The package lives at the root of this directory rather than in a nested
# subdirectory, so map the import name onto ".".
[tool.setuptools]
packages = ["app_group_lifecycle_audit_logger"]

[tool.setuptools.package-dir]
app_group_lifecycle_audit_logger = "."
