[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "access-conditional-access"
# setup.py declared no version, so setuptools defaulted the built distribution
# to 0.0.0. PEP 621 requires the field, so it is spelled out at the value the
# distribution already carried rather than silently promoted to a real one.
version = "0.0.0"
# A range, not an exact pin: pluggy is supplied by the app, and plugins
# install into the app's venv, so an exact pin here would silently
# re-resolve the app's locked pluggy.
dependencies = ["pluggy>=1.5,<2"]

[project.entry-points."access_conditional_access"]
conditional_access = "conditional_access"

[tool.setuptools]
py-modules = ["conditional_access"]
