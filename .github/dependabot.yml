version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait 7 days after a release before proposing the bump, so we don't
    # immediately adopt a freshly-published (potentially yanked or
    # compromised) version.
    cooldown:
      default-days: 7
    groups:
      uv-major:
        patterns:
          - "*"
        update-types:
        - "major"
      uv-minor:
        patterns:
          - "*"
        update-types:
        - "minor"
        - "patch"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@rollup/rollup-*"
      # @sentry/vite-plugin 5.4+ depends on the Sentry CLI, which is licensed
      # under the source-available FSL from 3.0 on. Stay on 4.x until that
      # license is approved for use.
      - dependency-name: "@sentry/vite-plugin"
        versions: [">=5"]
      # TypeScript 7's npm package doesn't ship the compiler API that
      # @openapi-codegen reaches through tsutils, so `npm run codegen` hangs.
      # Stay below 7 until the codegen stops depending on that API.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      mui:
        patterns:
          - "@mui/*"
      sentry:
        patterns:
          - "@sentry/*"
      react-core:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      testing:
        patterns:
          - "@testing-library/*"
          - "vitest"
          - "@vitest/*"
          - "jsdom"
      build-tools:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "typescript"
          - "prettier"
          - "husky"
          - "lint-staged"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    # Workflow files stored in the
    # default location of `.github/workflows`
    directory: "/"
    schedule:
      interval: "weekly"
    # Workflows pin each action to a commit SHA with a `# vX.Y.Z` comment;
    # Dependabot bumps both together. The cooldown has the same purpose as uv's.
    cooldown:
      default-days: 7
    # Majors are split out because they can change an action's inputs or
    # defaults and deserve their own review; minor and patch bumps batch.
    groups:
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
      github-actions-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  # Covers the Dockerfile's base images. Dependabot's docker ecosystem reads
  # only Dockerfiles and Kubernetes manifests, not `services:` or `container:`
  # images in workflows, so those digests are bumped by hand.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
