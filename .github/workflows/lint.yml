name: Linting and formatting checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  node-lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Pin npm >= 11.16 so the v12 install defaults in .npmrc are enforced
      # regardless of the npm bundled with Node. (--engine-strict=false so this
      # bootstrap step itself isn't gated by package.json "engines".)
      # npm cannot install itself from package-lock.json, so the exact version is
      # the pin here.
      - name: Upgrade npm to enforce npm v12 install defaults
        run: npm install -g npm@11.16.0 --engine-strict=false # zizmor: ignore[adhoc-packages]
      - name: Install dependencies
        run: npm ci
      - name: Check engines.node against locked packages
        run: npm run check:engines
      - name: Check prettier formatting
        run: npx prettier --check .
      - name: Type check
        run: npm run typecheck
  python-lint:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # Pin uv itself (not "latest") so a compromised uv release can't
          # run in CI. Keep in sync with the uv version in the Dockerfile.
          version: "0.11.10"
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Run ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Run ty
        run: uv run ty check .
