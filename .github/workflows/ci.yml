name: Test Python

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python-test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.13"]

    services:
      postgres:
        # Docker Hub image
        image: postgres
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          # Pin uv itself (not "latest") so a compromised uv release can't
          # run in CI. Keep in sync with the uv version in the Dockerfile.
          version: "0.11.10"
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Check dependencies are in sync
        # Fail if uv.lock drifts from pyproject.toml or the environment
        # drifts from uv.lock (e.g. a dependency edit without `uv lock`).
        run: uv sync --locked --check
      - name: Constrain plugin installs to uv.lock
        # Mirrors the Dockerfile's UV_CONSTRAINT, so the example plugin installs
        # below fail on a conflict with a locked version instead of replacing it.
        # --no-emit-local drops the editable dev-group audit logger, which a
        # constraints file can't carry.
        run: |
          uv export --frozen --no-hashes --no-emit-project --no-emit-local --no-header -q -o "$RUNNER_TEMP/constraints.txt"
          echo "UV_CONSTRAINT=$RUNNER_TEMP/constraints.txt" >> "$GITHUB_ENV"
      # No path argument, so this picks up both roots in `testpaths`: the api suite
      # under tests/ and the example plugins' own tests. The plugin tests stub their
      # third-party SDKs, so they need no plugin installed and no extra dependency.
      - name: Test (sqlite)
        run: uv run pytest -s
      # Only the DB-backed suite is worth re-running against postgres; the plugin
      # tests never touch a session, hence the explicit path here.
      - name: Test (postgresql)
        run: uv run pytest -s tests
        env:
          TEST_DATABASE_URI: postgresql+asyncpg://postgres:postgres@localhost:5432
      - name: Test installing the notifications plugin
        run: |
          # Install the notifications plugin from examples/plugins/notifications
          if [ -d "examples/plugins/notifications" ]; then
            uv pip install ./examples/plugins/notifications
          else
            echo "Notifications plugin directory not found; skipping installation"
          fi
      - name: Test installing the Slack notifications plugin
        run: |
          # Install the Slack notifications plugin from examples/plugins/notifications_slack
          if [ -d "examples/plugins/notifications_slack" ]; then
            uv pip install ./examples/plugins/notifications_slack
          else
            echo "Slack notifications plugin directory not found; skipping installation"
          fi
      - name: Test installing the conditional access plugin
        run: |
          # Install the conditional access plugin from examples/plugins/conditional_access
          if [ -d "examples/plugins/conditional_access" ]; then
            uv pip install ./examples/plugins/conditional_access
          else
            echo "Conditional access plugin directory not found; skipping installation"
          fi
      - name: Test installing the health check plugin
        run: |
          # Install the health check plugin from examples/plugins/health_check_plugin
          if [ -d "examples/plugins/health_check_plugin" ]; then
            uv pip install ./examples/plugins/health_check_plugin
          else
            echo "Health check plugin directory not found; skipping installation"
          fi
      - name: Test installing the Datadog metrics reporter plugin
        run: |
          # Install the Datadog metrics reporter plugin from examples/plugins/datadog_metrics_reporter
          if [ -d "examples/plugins/datadog_metrics_reporter" ]; then
            uv pip install ./examples/plugins/datadog_metrics_reporter
          else
            echo "Datadog metrics reporter plugin directory not found; skipping installation"
          fi
      - name: Test installing the app group lifecycle audit logger plugin
        run: |
          # Install the app group lifecycle audit logger plugin from examples/plugins/app_group_lifecycle_audit_logger
          if [ -d "examples/plugins/app_group_lifecycle_audit_logger" ]; then
            uv pip install ./examples/plugins/app_group_lifecycle_audit_logger
          else
            echo "App group lifecycle audit logger plugin directory not found; skipping installation"
          fi
      - name: Check the plugin installs did not re-resolve the app's locked deps
        # The steps above install example plugins on top of the venv `uv sync --locked`
        # built, mirroring the Dockerfile's install_plugin helper and `make
        # install-plugins`. `uv pip install` ignores the app's own requirements, so a
        # plugin requirement that excludes a locked version silently re-resolves it
        # *after* the sync, where `uv sync --locked --check` above cannot see it (e.g. a
        # plugin pinning pluggy==1.5.0 downgrading the locked pluggy). UV_CONSTRAINT
        # should make such an install fail outright; this is the backstop that proves
        # it did. It compares against uv.lock rather than pyproject.toml, whose
        # specifiers are ranges, and so covers transitive dependencies too.
        # --no-sync so this inspects the post-plugin-install venv rather than resyncing it.
        run: |
          uv run --no-sync python - <<'PY'
          import sys, tomllib
          from importlib.metadata import distributions
          from packaging.utils import canonicalize_name

          # Editable and virtual sources (the project itself, the dev-group audit
          # logger) are reinstalled from a path by the steps above, so skip them.
          locked = {}
          for pkg in tomllib.loads(open("uv.lock").read())["package"]:
              if "version" in pkg and not {"editable", "virtual"} & pkg["source"].keys():
                  locked.setdefault(canonicalize_name(pkg["name"]), set()).add(pkg["version"])
          drift = sorted(
              f"  {name}: uv.lock has {', '.join(sorted(locked[name]))}, venv has {dist.version}"
              for dist in distributions()
              if (name := canonicalize_name(dist.metadata["Name"])) in locked
              and dist.version not in locked[name]
          )
          if drift:
              sys.exit(
                  "Example plugin installs re-resolved locked dependencies:\n"
                  + "\n".join(drift)
                  + "\nLoosen the offending plugin's dependencies to a compatible range."
              )
          print(f"OK: installed versions match uv.lock for all {len(locked)} locked packages")
          PY
